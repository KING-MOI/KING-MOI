name: update readme

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/gen_svg.py
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
      - run: |
          git diff --quiet assets/readme.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme.svg
          git commit -m "chore: refresh readme.svg"
          git pull --rebase
          git push
